<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Character converter (dev tool)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #222; color: #ccc; font: 12px monospace; }
      #log { position: fixed; left: 8px; top: 8px; white-space: pre; text-shadow: 0 0 2px #000; z-index: 1; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="log"></div>
    <script type="module">
      // Rocketbox (MIT) FBX -> glTF: meters, PBR materials (roughness derived from the specular map),
      // alpha-tested hair cards, and the animation clips the piece uses (see avatars.json).
      import * as THREE from 'three';
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
      import { TGALoader } from 'three/addons/loaders/TGALoader.js';
      import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      const logEl = document.getElementById('log');
      const log = (...a) => (logEl.textContent += a.join(' ') + '\n');
      /** Keyframe rate of trimmed clips. */
      const TRIM_FPS = 30;

      // TGALoader yields upright RGBA rows; GLTFExporter cannot resize DataTextures,
      // so every map goes through a canvas (downscaled) and behaves like a normal image texture.
      function toCanvasTexture(tex, size, transform) {
        const { width, height, data } = tex.image;
        const src = document.createElement('canvas');
        src.width = width;
        src.height = height;
        const pixels = new Uint8ClampedArray(data.length);
        for (let i = 0; i < data.length; i += 4) {
          const px = transform ? transform(data[i], data[i + 1], data[i + 2], data[i + 3]) : [data[i], data[i + 1], data[i + 2], data[i + 3]];
          pixels.set(px, i);
        }
        src.getContext('2d').putImageData(new ImageData(pixels, width, height), 0, 0);
        const dst = document.createElement('canvas');
        dst.width = dst.height = size;
        const ctx = dst.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(src, 0, 0, size, size);
        const t = new THREE.CanvasTexture(dst);
        t.flipY = tex.flipY;
        return t;
      }

      const specToRoughness = (r, g, b) => {
        const s = (r + g + b) / (3 * 255);
        return [255, Math.round(255 * Math.min(1, Math.max(0.38, 0.95 - s * 0.9))), 0, 255];
      };

      function toStandard(m, size) {
        const s = new THREE.MeshStandardMaterial({ name: m.name, color: 0xffffff, roughness: 1, metalness: 0 });
        if (m.map) {
          s.map = toCanvasTexture(m.map, size);
          s.map.colorSpace = THREE.SRGBColorSpace;
        }
        if (m.normalMap) s.normalMap = toCanvasTexture(m.normalMap, size);
        if (m.specularMap) s.roughnessMap = s.metalnessMap = toCanvasTexture(m.specularMap, size, specToRoughness);
        if (/opacity/i.test(m.name) || m.transparent) {
          s.alphaTest = 0.45;
          s.transparent = false;
          s.side = THREE.DoubleSide;
        }
        return s;
      }

      function trimmed(clip, range, name) {
        if (!range) return clip;
        const [a, b] = range;
        const cut = THREE.AnimationUtils.subclip(clip, name, Math.round(a * TRIM_FPS), Math.round(b * TRIM_FPS), TRIM_FPS);
        return cut;
      }

      async function convert(avatar, fbx, settled) {
        log('---', avatar.key, avatar.name);
        const root = await fbx.loadAsync(`/src/${avatar.name}.fbx`);
        await settled(); // textures finish after the model
        root.name = avatar.key;
        root.scale.setScalar(0.01); // centimeters -> meters
        const names = new Set();
        root.traverse((o) => {
          // children are rigged on a differently named root; the clips address Bip01
          if (avatar.renameRoot) o.name = o.name.replaceAll(avatar.renameRoot, 'Bip01');
          names.add(o.name);
          if (o.isMesh) {
            o.material = Array.isArray(o.material) ? o.material.map((m) => toStandard(m, avatar.size)) : toStandard(o.material, avatar.size);
            log('mesh', o.name, o.isSkinnedMesh ? 'skinned' : '', o.geometry.attributes.position.count, 'verts', (Array.isArray(o.material) ? o.material : [o.material]).map((m) => m.name).join(','));
          }
        });
        const clips = [];
        for (const c of avatar.clips) {
          const a = await fbx.loadAsync(`/src/${c.name}.max.fbx`);
          let clip = a.animations[0];
          clip.name = c.name;
          clip.tracks = clip.tracks.filter((t) => names.has(t.name.split('.')[0]));
          if (avatar.quaternionsOnly) {
            // a smaller skeleton: rotations carry over, translations would stretch the limbs
            clip.tracks = clip.tracks.filter((t) => t.name.endsWith('.quaternion') || t.name === 'Bip01.position');
            for (const t of clip.tracks) {
              if (t.name === 'Bip01.position') t.values = t.values.map((v) => v * avatar.rootScale);
            }
          }
          clip = trimmed(clip, c.trim, c.name);
          clip.optimize();
          clips.push(clip);
          log('clip', c.name, clip.duration.toFixed(2) + 's', clip.tracks.length, 'tracks');
        }
        const glb = await new GLTFExporter().parseAsync(root, {
          binary: true,
          animations: clips,
          maxTextureSize: avatar.size,
          onlyVisible: true,
        });
        const res = await fetch(`/save/${avatar.key}.glb`, { method: 'PUT', body: glb });
        log(await res.text(), (glb.byteLength / 1e6).toFixed(2), 'MB');
        return glb;
      }

      async function preview(glbs) {
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.AgXToneMapping;
        document.body.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x30333a);
        scene.add(new THREE.HemisphereLight(0xdde6ff, 0x302f2a, 1.8));
        const key = new THREE.DirectionalLight(0xffffff, 2.5);
        key.position.set(2, 4, 3);
        scene.add(key);
        const loader = new GLTFLoader();
        let x = -(glbs.length - 1) * 0.5;
        for (const glb of glbs) {
          const gltf = await loader.parseAsync(glb, '');
          gltf.scene.position.x = x;
          x += 1;
          scene.add(gltf.scene);
          let bones = 0;
          gltf.scene.traverse((o) => o.isBone && bones++);
          log(gltf.scene.name, 'bones', bones, 'clips', gltf.animations.map((c) => c.name).join(','));
        }
        const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);
        cam.position.set(0, 1.0, 2 + glbs.length * 1.6);
        cam.lookAt(0, 0.9, 0);
        renderer.render(scene, cam);
      }

      async function run() {
        const { avatars } = await (await fetch('/avatars.json')).json();
        const only = new URLSearchParams(location.search).get('only')?.split(',');
        const glbs = [];
        for (const avatar of avatars) {
          if (only && !only.includes(avatar.key)) continue;
          const manager = new THREE.LoadingManager();
          manager.isLoading = true;
          const settled = () =>
            new Promise((resolve) => {
              const check = () => (manager.isLoading ? setTimeout(check, 100) : resolve());
              check();
            });
          manager.onProgress = (url, loaded, total) => (manager.isLoading = loaded < total);
          manager.onLoad = () => (manager.isLoading = false);
          manager.addHandler(/\.tga$/i, new TGALoader(manager));
          manager.setURLModifier((url) => (/\.tga$/i.test(url) ? `/src/${url.split(/[\\/]/).pop()}` : url));
          glbs.push(await convert(avatar, new FBXLoader(manager), settled));
        }
        await preview(glbs);
        log('DONE');
        document.title = 'DONE';
      }
      run().catch((e) => {
        log('ERROR', e.stack || e);
        document.title = 'ERROR';
      });
    </script>
  </body>
</html>

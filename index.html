<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>The Dream of the Photo</title>
    <meta name="description" content="The dream of a photograph turns hair white, the dream of a photograph, every evening, half. A narrated nightmare in seven evenings and thirty-three minutes, dreamt by an instant photograph." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Dream of the Photo" />
    <meta property="og:description" content="The dream of a photograph turns hair white, the dream of a photograph, every evening, half." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://the-dream-of-the-photo.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://the-dream-of-the-photo.vercel.app/og.jpg" />
    <!-- no icon yet: an empty one, so the browser does not ask for a file that is not there -->
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/protest-revolution-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html {
        background: #000;
        color: #e6e1d6;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="The Dream of the Photo: the picture"></canvas>

    <div class="overlay">
      <!-- the film's frame: two bars that cut a wide screen down to 2.39:1 -->
      <div class="letterbox" aria-hidden="true"></div>

      <!-- the title screen: loads, then waits for the first step -->
      <section class="start" data-ui="start" aria-labelledby="start-title">
        <header class="start__top">
          <p class="start__kicker" data-i18n="kicker">seven evenings, thirty-three minutes</p>
          <div class="seg" role="group" data-ui="lang" data-i18n-label="language">
            <button type="button" data-lang="tr" lang="tr">TR</button>
            <button type="button" data-lang="en" lang="en">EN</button>
          </div>
        </header>
        <div class="start__titlebox">
          <h1 class="title" id="start-title" lang="en" aria-label="The Dream of the Photo">
            <span class="title__first" aria-hidden="true">THE DREAM</span>
            <span class="title__rest" aria-hidden="true"><span class="title__of">OF THE</span> <span class="title__photo" data-text="PHOTO">PHOTO</span></span>
          </h1>
        </div>
        <p class="motto start__motto" data-ui="motto"></p>
        <div class="start__foot">
          <p class="start__warning" data-i18n="warning"></p>
          <ul class="start__notes">
            <li data-ui="moves-note" data-i18n="moves"></li>
            <li data-i18n="headphones"></li>
          </ul>
          <div class="start__go">
            <div class="loader" data-ui="load" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-label="loading">
              <p class="loader__label"><span data-i18n="loading">Developing</span> <span data-ui="loader-label">0%</span></p>
              <div class="loader__track"><span class="loader__fill" data-ui="loader-bar"></span></div>
            </div>
            <button class="btn start__begin" type="button" data-ui="start-button" disabled><span data-i18n="start">Begin</span></button>
            <button class="btn start__begin" type="button" data-ui="continue" hidden><span data-i18n="continueFrom"></span> <span data-ui="continue-name"></span></button>
          </div>
        </div>
      </section>

      <!-- the HUD while playing -->
      <div class="hud" data-ui="hud">
        <!-- there only while the pointer moves: the screen belongs to the picture -->
        <div class="hud__edge" data-ui="hud-edge">
          <div class="hud__top">
            <div class="chip chapter">
              <span class="chapter__number" data-ui="chapter-number">I</span>
              <span data-ui="chapter-name" aria-live="polite"></span>
            </div>
            <div class="hud__corner">
              <button class="chip" type="button" data-ui="sound" aria-pressed="false" aria-labelledby="hud-sound-name">
                <span id="hud-sound-name" data-i18n="sound">Sound</span>
                <span class="chip__state" data-ui="sound-state">Off</span>
              </button>
              <button class="chip" type="button" data-ui="voice" aria-pressed="true" aria-labelledby="hud-voice-name">
                <span id="hud-voice-name" data-i18n="voice">Voice</span>
                <span class="chip__state" data-ui="voice-state">On</span>
              </button>
              <div class="seg seg--hud" role="group" data-ui="lang" data-i18n-label="language">
                <button type="button" data-lang="tr" lang="tr">TR</button>
                <button type="button" data-lang="en" lang="en">EN</button>
              </div>
              <button class="chip" type="button" data-ui="menu-button" data-i18n="menu" data-i18n-label="menuLabel">Menu</button>
            </div>
          </div>
          <!-- the journey: its evenings, and the year the dream has reached (a minute of the film is a year) -->
          <div class="journey" aria-hidden="true">
            <div class="journey__track">
              <div class="journey__fill" data-ui="journey-fill"></div>
              <div class="journey__ticks" data-ui="journey-ticks"></div>
            </div>
            <span class="chip journey__years" data-ui="years"></span>
          </div>
        </div>

        <!-- an evening begins: stamped on the picture, then gone -->
        <div class="stamp" data-ui="stamp" aria-hidden="true">
          <span class="stamp__number" data-ui="stamp-number"></span>
          <span class="stamp__name" data-ui="stamp-name"></span>
        </div>

        <div class="tutorial" data-ui="tutorial">
          <p class="tutorial__box">
            <span class="key" data-ui="tutorial-key"></span>
            <span data-ui="tutorial-text"></span>
          </p>
        </div>
      </div>

      <!-- the end: black, the credits rolling up it, and what is left -->
      <section class="end" data-ui="end" aria-labelledby="end-title">
        <div class="end__roll" data-ui="end-roll">
          <div class="end__card credits__opening">
            <p class="credits__title" lang="en">The Dream of the Photo</p>
            <p class="motto credits__motto" data-ui="credits-motto"></p>
          </div>
          <dl class="end__card credits__entry">
            <dt data-i18n="creditDirection"></dt>
            <dd data-ui="credit-director"></dd>
          </dl>
          <dl class="end__card credits__entry">
            <dt data-i18n="creditVoice"></dt>
            <dd data-ui="credit-engine"></dd>
          </dl>
          <dl class="end__card credits__entry">
            <dt data-i18n="creditScore"></dt>
            <dd data-i18n="creditScoreText"></dd>
          </dl>
          <dl class="end__card credits__entry credits__entry--small">
            <dt data-i18n="creditAssets"></dt>
            <dd>
              <span data-i18n="creditCc0"></span>
              <span data-i18n="creditCcBy"></span>
              <span data-i18n="creditOther"></span>
            </dd>
          </dl>
          <div class="end__card end__panel" data-ui="end-panel">
            <h2 class="end__title" id="end-title" lang="en">The Dream of the Photo</h2>
            <p class="end__caption" data-i18n="endAlbum" data-ui="end-caption" hidden></p>
            <div class="end__album" data-ui="end-album"></div>
            <button class="btn end__replay" type="button" data-ui="replay"><span data-i18n="replay">Dream it again</span></button>
          </div>
        </div>
      </section>

      <!-- what is said, at the foot of the picture: typed on screen, whole to a screen reader -->
      <p class="narration" data-ui="narration" aria-hidden="true"></p>
      <p class="sr-only" data-ui="narration-voice" aria-live="polite"></p>

      <!-- what a room lets you do, for as long as it lets you -->
      <p class="room-hint" data-ui="room-hint" aria-live="polite"></p>

      <!-- the pause menu -->
      <section class="menu" data-ui="menu" aria-labelledby="menu-title" hidden>
        <div class="menu__panel">
          <div class="menu__main">
            <h2 class="menu__title" id="menu-title" data-i18n="paused">Paused</h2>
            <div class="menu__actions">
              <button class="btn btn--solid" type="button" data-ui="resume"><span data-i18n="resume">Resume</span></button>
              <button class="btn" type="button" data-ui="skip"><span data-i18n="skip">Skip this part</span></button>
              <button class="btn" type="button" data-ui="restart"><span data-i18n="restart">Start over</span></button>
            </div>
            <dl class="menu__settings">
              <div>
                <dt data-i18n="language">Language</dt>
                <dd>
                  <div class="seg" role="group" data-ui="lang" data-i18n-label="language">
                    <button type="button" data-lang="tr" lang="tr">Türkçe</button>
                    <button type="button" data-lang="en" lang="en">English</button>
                  </div>
                </dd>
              </div>
              <div>
                <dt id="menu-sound-name" data-i18n="sound">Sound</dt>
                <dd>
                  <button class="toggle" type="button" data-ui="menu-sound" aria-pressed="false" aria-labelledby="menu-sound-name">
                    <span data-ui="menu-sound-label">Off</span>
                  </button>
                </dd>
              </div>
              <div>
                <dt id="menu-voice-name" data-i18n="voice">Voice</dt>
                <dd>
                  <button class="toggle" type="button" data-ui="menu-voice" aria-pressed="true" aria-labelledby="menu-voice-name">
                    <span data-ui="menu-voice-label">On</span>
                  </button>
                </dd>
              </div>
              <div data-ui="fullscreen-row">
                <dt id="menu-fullscreen-name" data-i18n="fullscreen">Full screen</dt>
                <dd>
                  <button class="toggle" type="button" data-ui="fullscreen" aria-pressed="false" aria-labelledby="menu-fullscreen-name">
                    <span data-ui="fullscreen-label">Off</span>
                  </button>
                </dd>
              </div>
              <div>
                <dt id="menu-moves-name" data-i18n="moves">Moves by itself</dt>
                <dd>
                  <button class="toggle" type="button" data-ui="moves" aria-pressed="true" aria-labelledby="menu-moves-name">
                    <span data-ui="moves-label">On</span>
                  </button>
                </dd>
              </div>
            </dl>
          </div>
          <div class="menu__side">
            <h3 class="menu__subtitle" data-i18n="controls">Controls</h3>
            <ul class="keys" data-ui="menu-keys"></ul>
            <p class="menu__credits">
              <span data-i18n="credits"></span>
              <a href="https://github.com/cayankuzu/the-dream-of-the-photo" target="_blank" rel="noopener" data-i18n="source">Source code</a>
              <a href="/THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener" data-i18n="notices">Licences</a>
            </p>
          </div>
        </div>
      </section>
    </div>

    <noscript><p class="noscript">This piece needs JavaScript and WebGL.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
